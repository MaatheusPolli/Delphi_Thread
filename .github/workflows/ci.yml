name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  estrutura:
    name: Estrutura do projeto
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Units do .pas estão no .dpr
        run: |
          status=0
          for pas in un_*.pas; do
            if ! grep -q "$pas" Thread.dpr; then
              echo "::error file=$pas::unit não referenciada em Thread.dpr"
              status=1
            fi
          done
          exit $status

      - name: .dfm correspondente existe
        run: |
          status=0
          for pas in un_*.pas; do
            dfm="${pas%.pas}.dfm"
            if grep -q 'R \*\.dfm' "$pas" && [ ! -f "$dfm" ]; then
              echo "::error file=$pas::arquivo $dfm ausente"
              status=1
            fi
          done
          exit $status

  testes-unitarios:
    name: Testes da thread (Free Pascal)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instala Free Pascal
        run: sudo apt-get update && sudo apt-get install -y fp-compiler

      - name: Roda os testes
        run: bash tests/run_tests.sh

  build-delphi:
    name: Build Delphi (runner próprio)
    # Só roda se o repositório tiver a variável DELPHI_RUNNER=true e um runner com Delphi instalado
    if: vars.DELPHI_RUNNER == 'true'
    runs-on: [self-hosted, windows, delphi]
    env:
      BDS: ${{ vars.DELPHI_BDS }}  # ex.: C:\Program Files (x86)\Embarcadero\Studio\23.0
    steps:
      - uses: actions/checkout@v4

      - name: Compila Thread.dpr (Win32 e Win64)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out/win32, out/win64 | Out-Null
          & "$env:BDS\bin\dcc32.exe" -B -Q "-E$PWD\out\win32" "-N0$PWD\out\win32\dcu" Thread.dpr
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:BDS\bin\dcc64.exe" -B -Q "-E$PWD\out\win64" "-N0$PWD\out\win64\dcu" Thread.dpr
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: Thread-exe
          path: out/**/Thread.exe
